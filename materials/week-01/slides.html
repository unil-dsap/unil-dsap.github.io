<h1 id="session-1-the-computer-files-and-running-python">Session 1: The computer, files, and running Python</h1>
<h2 id="after-today-you-can-find-any-file-on-a-computer-run-a-python-program-on-it-and-read-your-first-error-without-fear">After today you can find any file on a computer, run a Python program on it, and read your first error without fear.</h2>
<p>Data Science and Advanced Programming · UNIL · 2026</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="you-have-used-computers-for-fifteen-years">You have used computers for fifteen years</h1>
<p>And yet: could you find a file you saved last month —<br />
<strong>without the Recents list, without search?</strong></p>
<p>Most people cannot. Phones and Jupyter notebooks hid this from you.</p>
<p>Today we take the cover off. Everything else this semester<br />
stands on the next 90 minutes.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="a-file-is-three-things">A file is three things</h1>
<ol>
<li><strong>Contents</strong> — the bytes inside.</li>
<li><strong>A name</strong> — including the part after the dot: <code>ledger.csv</code>,<br />
<code>hello.py</code>. The ending is called the <strong>extension</strong>. It is a naming<br />
convention — a label, not magic.</li>
<li><strong>A place</strong> — every file sits in exactly one folder.</li>
</ol>
<p><strong>Windows has been hiding extensions from you your whole life.</strong><br />
That was a choice someone made on your behalf. We undo it today.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="folders-form-a-tree-and-a-path-is-an-address">Folders form a tree, and a path is an address</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">files/
└── dsap/
    ├── ledger.csv
    └── ledger.py
</code></pre>
<ul>
<li><code>/files/dsap/ledger.csv</code> — the full address: an <strong>absolute path</strong>.</li>
<li><code>ledger.csv</code> — the address <em>from where you stand</em>: a <strong>relative path</strong>.</li>
</ul>
<p>Two dialects exist: Windows writes <code>\</code>, everything else writes <code>/</code>.<br />
On Nuvolos it is <code>/</code> for everyone — one of the reasons we all work<br />
on the same machine.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="the-working-directory-where-a-program-stands">The working directory: where a program stands</h1>
<p>A running program stands in one folder — its <strong>working directory</strong>.</p>
<p>When your code says <code>ledger.csv</code>, the program looks for it<br />
<strong>in the folder where it stands</strong>. Not where the file &quot;should&quot; be.<br />
Not where you last saw it. Where the program stands.</p>
<p>Hold onto this sentence. In thirty minutes it explains<br />
your first error.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="three-windows-three-jobs">Three windows, three jobs</h1>
<table>
<thead>
<tr>
<th>Window</th>
<th>Job</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Editor</strong></td>
<td>where you write the program — a text file</td>
</tr>
<tr>
<td><strong>Terminal</strong></td>
<td>where you tell the machine to run it</td>
</tr>
<tr>
<td><strong>Interpreter</strong></td>
<td>the program (<code>python</code>) that reads your file, line by line, and does what it says</td>
</tr>
</tbody>
</table>
<p>You type in the editor. You run in the terminal.<br />
Python is the thing being run <em>with your file as input</em>.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="the-smallest-possible-program">The smallest possible program</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-number">1</span>  <span class="hljs-comment"># hello.py — the smallest possible program</span>
<span class="hljs-number">2</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;hello from your machine&quot;</span>)
</code></pre>
<p>Run it in the terminal:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">$ python hello.py
hello from your machine
</code></pre>
<p>Line 1 is a <strong>comment</strong> — the machine ignores everything after <code>#</code>.<br />
Line 2 is an instruction. That is the entire program.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="the-editor-edits-memory-the-disk-holds-truth">The editor edits memory. The disk holds truth.</h1>
<p><strong>Run runs the disk.</strong></p>
<p>Change the text in the editor and do not save:<br />
the file on disk is still the old one — and Run runs the old one.</p>
<p>The white dot on the tab means <strong>unsaved</strong>.<br />
This is support ticket #1 in every programming course ever taught.<br />
Now it is defused: see the dot → save → then run.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="what-jupyter-never-told-you">What Jupyter never told you</h1>
<p>If you met Python before, it was probably a notebook. Three secrets:</p>
<ol>
<li>A notebook is <strong>a file</strong> like any other (<code>.ipynb</code>).</li>
<li>The kernel is <strong>a Python process that remembers</strong> everything you ran.</li>
<li>Cells run <strong>in the order you click</strong> — not top to bottom.</li>
</ol>
<p>That memory plus your clicking order can build a state<br />
no one can reproduce — including you, tomorrow.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="a-script-is-the-honest-version">A script is the honest version</h1>
<p>A <code>.py</code> file runs <strong>top to bottom, every time, from nothing</strong>.</p>
<p>No memory of last time. No click order. Run it twice — same<br />
thing happens twice.</p>
<p>This course uses scripts. When you meet notebooks again<br />
(Part 2, and real life), you will know what they really are:<br />
a script with memory and a shuffled deck.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="the-ai-assistant-cannot-see-your-machine">The AI assistant cannot see your machine</h1>
<p>Live demo. We ask a chatbot:</p>
<blockquote>
<p>&quot;Where did my file ledger.csv go?&quot;</p>
</blockquote>
<p>Watch it answer confidently. It <strong>cannot know</strong> — it has never<br />
seen your folders. The model sees <strong>exactly what you paste,<br />
nothing else.</strong></p>
<p>This is the first rule of working with AI, and it never stops<br />
being true.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>

<header>Session 1 · The computer, files, and running Python</header>
<h1 id="two-ways-to-work-with-ai--watch-both">Two ways to work with AI — watch both</h1>
<p><strong>Chat</strong> (your tool until session 6):<br />
you paste, it answers, <em>you</em> run the code. You are its eyes and hands.</p>
<p><strong>Harness / agent</strong> (you'll meet it in session 6):<br />
it reads files, runs code, sees errors, tries again — on its own.</p>
<p>Same models underneath. Different failure modes.<br />
Today you only need the names.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="read-your-first-real-program">Read: your first real program</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-number">1</span>  <span class="hljs-comment"># ledger.py — your first program. Run it from the folder it lives in.</span>
<span class="hljs-number">2</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;DSAP ledger, version 0&quot;</span>)
<span class="hljs-number">3</span>  line = <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;ledger.csv&quot;</span>).readline()
<span class="hljs-number">4</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;first line of the ledger:&quot;</span>, line.strip())
<span class="hljs-number">5</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;done — this line always runs last&quot;</span>)
</code></pre>
<p>Read it cold. What do you <em>think</em> each line does?<br />
(Line 3 is allowed to be mysterious for now.)</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="the-same-program-after-the-concepts">The same program, after the concepts</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-number">1</span>  <span class="hljs-comment"># ledger.py — your first program. Run it from the folder it lives in.</span>
<span class="hljs-number">2</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;DSAP ledger, version 0&quot;</span>)
<span class="hljs-number">3</span>  line = <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;ledger.csv&quot;</span>).readline()
<span class="hljs-number">4</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;first line of the ledger:&quot;</span>, line.strip())
<span class="hljs-number">5</span>  <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;done — this line always runs last&quot;</span>)
</code></pre>
<ul>
<li>Line 3: opens <code>ledger.csv</code> — <strong>a relative path</strong>. The program looks<br />
<strong>where it stands</strong>. The details of <code>open</code> come in session 6 —<br />
today it is furniture.</li>
<li>The load-bearing idea is not on any line: it is <strong>where you run this</strong>.</li>
</ul>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="run-it--from-the-right-folder">Run it — from the right folder</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">$ python ledger.py
DSAP ledger, version 0
first line of the ledger: ticker,shares,price
done — this line always runs last
</code></pre>
<p>Three lines printed, top to bottom, exactly as written.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="run-it--from-the-wrong-folder">Run it — from the wrong folder</h1>
<p>Same program. Same machine. One folder up.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">$ python dsap/ledger.py
DSAP ledger, version 0
  File &quot;ledger.py&quot;, line 3, in &lt;module&gt;
    line = open(&quot;ledger.csv&quot;).readline()
FileNotFoundError: [Errno 2] No such file or directory: &#x27;ledger.csv&#x27;
</code></pre>
<p>Line 2 printed — then line 3 died. Line 5 <strong>never ran</strong>.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="this-error-is-about-where-not-about-wrong-code">This error is about WHERE, not about wrong code</h1>
<p><code>FileNotFoundError: No such file or directory: 'ledger.csv'</code></p>
<p>The program is correct. It simply <strong>stood in the wrong folder</strong><br />
and looked for <code>ledger.csv</code> there.</p>
<p>Read an error from the <strong>bottom line up</strong>: the last line names<br />
what happened. This one is the machine saying, precisely:<br />
<em>&quot;I looked where I stand, and it is not here.&quot;</em></p>
<p>The machine explains itself. Errors are information, not failure.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="Session 1 · The computer, files, and running Python" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--header:Session 1 · The computer, files, and running Python;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="19">
<header>Session 1 · The computer, files, and running Python</header>
<h1 id="what-you-can-now-do">What you can now do</h1>
<ul>
<li>Find any file by walking the folder tree — no search box.</li>
<li>Say what a path is, and which folder a program stands in.</li>
<li>Run a Python file from the terminal.</li>
<li>Read a <code>FileNotFoundError</code> and know it means <em>where</em>, not <em>wrong</em>.</li>
</ul>
<p>Next session (Sep 28): <strong>variables and types</strong> — what <code>x = x + 1</code><br />
means, and why your bank balance should never be a float.</p>

</section>
