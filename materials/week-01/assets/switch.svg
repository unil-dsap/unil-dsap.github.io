<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img"
     aria-label="Left: a transistor as a switch with current in and out. Right: the same switch with a control wire that decides whether it passes.">
  <defs>
    <marker id="arrIn" markerWidth="7" markerHeight="7" refX="6" refY="2.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,2.2 L0,4.4 z" fill="#0066ff"/>
    </marker>
    <marker id="arrOut" markerWidth="7" markerHeight="7" refX="6" refY="2.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,2.2 L0,4.4 z" fill="#3a9b57"/>
    </marker>
    <marker id="arrCtl" markerWidth="7" markerHeight="7" refX="6" refY="2.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,2.2 L0,4.4 z" fill="#e08a1e"/>
    </marker>
  </defs>

  <style>
    .ttl  { font-family: "Unil Sans", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #1e2b3e; }
    .in   { font-family: "Unil Sans", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0066ff; }
    .out  { font-family: "Unil Sans", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #3a9b57; }
    .ctl  { font-family: "Unil Sans", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #e08a1e; }
    .cap  { font-family: "Unil Sans", Arial, sans-serif; font-size: 16px; fill: #4b5563; }
  </style>

  <!-- ================================================================
       PANEL 1 : the switch on its own. Current arrives on the left and
       leaves on the right, or it does not. Nothing else to it.
       ================================================================ -->
  <g transform="translate(0,0)">
    <text class="ttl" x="230" y="24" text-anchor="middle">a transistor is a switch</text>

    <line x1="30" y1="170" x2="186" y2="170" stroke="#0066ff" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrIn)"/>
    <line x1="272" y1="170" x2="428" y2="170" stroke="#3a9b57" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrOut)"/>

    <circle cx="230" cy="170" r="38" fill="#fdfdfc" stroke="#1e2b3e" stroke-width="4"/>
    <line x1="208" y1="192" x2="252" y2="148" stroke="#1e2b3e" stroke-width="4" stroke-linecap="round"/>

    <text class="in"  x="100" y="200">input</text>
    <text class="out" x="360" y="200" text-anchor="middle">output</text>

    <text class="cap" x="230" y="262" text-anchor="middle">current passes through, or it does not</text>
  </g>

  <line x1="478" y1="40" x2="478" y2="272" stroke="#e5e9ef" stroke-width="2"/>

  <!-- ================================================================
       PANEL 2 : the same switch, plus the control wire. What makes a
       transistor special is that the handle is a third wire, not a hand.
       ================================================================ -->
  <g transform="translate(500,0)">
    <text class="ttl" x="230" y="24" text-anchor="middle">thrown by a third wire</text>

    <line x1="30" y1="170" x2="186" y2="170" stroke="#0066ff" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrIn)"/>
    <line x1="272" y1="170" x2="428" y2="170" stroke="#3a9b57" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrOut)"/>

    <!-- control current: in through one socket, out through the other -->
    <line x1="140" y1="62" x2="202" y2="140" stroke="#e08a1e" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrCtl)"/>
    <line x1="258" y1="140" x2="320" y2="62" stroke="#e08a1e" stroke-width="4"
          stroke-linecap="round" marker-end="url(#arrCtl)"/>

    <circle cx="230" cy="170" r="38" fill="#fdfdfc" stroke="#1e2b3e" stroke-width="4"/>
    <line x1="208" y1="192" x2="252" y2="148" stroke="#1e2b3e" stroke-width="4" stroke-linecap="round"/>

    <text class="ctl" x="230" y="48" text-anchor="middle">control</text>
    <text class="in"  x="100" y="200">input</text>
    <text class="out" x="360" y="200" text-anchor="middle">output</text>

    <text class="cap" x="230" y="262" text-anchor="middle">current here holds the switch open</text>
  </g>
</svg>
