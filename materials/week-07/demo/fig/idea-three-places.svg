<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" width="1100" height="345" font-family="Unil Sans, Arial, sans-serif">
  <!-- Where a change lives: working folder -> staging area -> history.
       State shown: session 6, after "git add ledger.py .gitignore". -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e2b3e"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    .place { fill: #fff; stroke: #395b8c; stroke-width: 2; }
    .title { font-size: 24px; font-weight: 700; fill: #1e2b3e; }
    .sub { font-size: 16px; fill: #4b5563; }
    .chip { fill: #f4f6f8; stroke: #d9dee5; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; fill: #14181d; }
    .cmd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; fill: #1e2b3e; }
    .rcmd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; fill: #b45309; }
    .arrow { stroke: #1e2b3e; stroke-width: 3; fill: none; }
    .back { stroke: #b45309; stroke-width: 3; fill: none; stroke-dasharray: 8 6; }
    .dot { fill: #395b8c; }
  </style>

  <!-- 1. working folder -->
  <rect class="place" x="10" y="20" width="300" height="200"/>
  <text class="title" x="30" y="58">Working folder</text>
  <text class="sub" x="30" y="84">the files you see and edit</text>
  <rect class="chip" x="30" y="110" width="200" height="34"/><text class="mono" x="44" y="133">ledger.py</text>
  <rect class="chip" x="30" y="154" width="200" height="34"/><text class="mono" x="44" y="177">.gitignore</text>

  <!-- 2. staging area -->
  <rect class="place" x="400" y="20" width="300" height="200"/>
  <text class="title" x="420" y="58">Staging area</text>
  <text class="sub" x="420" y="84">what the next commit will hold</text>
  <rect class="chip" x="420" y="110" width="200" height="34"/><text class="mono" x="434" y="133">ledger.py</text>
  <rect class="chip" x="420" y="154" width="200" height="34"/><text class="mono" x="434" y="177">.gitignore</text>

  <!-- 3. history -->
  <rect class="place" x="790" y="20" width="300" height="200" style="fill:#eef4fb;stroke:#1e2b3e;stroke-width:3"/>
  <text class="title" x="810" y="58">History (.git)</text>
  <text class="sub" x="810" y="84">every commit, kept for good</text>
  <circle class="dot" cx="830" cy="150" r="11"/><circle class="dot" cx="880" cy="150" r="11"/>
  <circle class="dot" cx="930" cy="150" r="11"/><circle class="dot" cx="980" cy="150" r="11"/>
  <circle class="dot" cx="1030" cy="150" r="11"/>
  <line x1="841" y1="150" x2="869" y2="150" stroke="#395b8c" stroke-width="3"/>
  <line x1="891" y1="150" x2="919" y2="150" stroke="#395b8c" stroke-width="3"/>
  <line x1="941" y1="150" x2="969" y2="150" stroke="#395b8c" stroke-width="3"/>
  <line x1="991" y1="150" x2="1019" y2="150" stroke="#395b8c" stroke-width="3"/>
  <circle cx="1030" cy="150" r="17" fill="none" stroke="#0066ff" stroke-width="3" stroke-dasharray="5 4"/>
  <text class="sub" x="1030" y="195" text-anchor="middle">next</text>

  <!-- forward arrows -->
  <line class="arrow" x1="316" y1="120" x2="394" y2="120" marker-end="url(#a)"/>
  <text class="cmd" x="355" y="108" text-anchor="middle">add</text>
  <line class="arrow" x1="706" y1="120" x2="784" y2="120" marker-end="url(#a)"/>
  <text class="cmd" x="745" y="108" text-anchor="middle">commit</text>

  <!-- the way back: restore copies the last commit over your edit -->
  <path class="back" d="M940,224 V270 Q940,284 926,284 H174 Q160,284 160,270 V228" marker-end="url(#r)"/>
  <text class="rcmd" x="550" y="310" text-anchor="middle">restore</text>
  <text class="sub" x="550" y="334" text-anchor="middle">puts the last committed version back in the working folder</text>
</svg>
