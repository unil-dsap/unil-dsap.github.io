<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <!-- Stylized VS Code (Light Modern): the first push. Left: the Source
       Control button when the repository has no remote yet. Right: the
       choice VS Code offers next. -->
  <style>
    .win { fill: #f8f8f8; stroke: #d0d0d0; stroke-width: 1.5; }
    .pick { fill: #fff; stroke: #c8c8c8; stroke-width: 1.5; }
    .head { font-size: 13px; font-weight: 700; fill: #3b3b3b; letter-spacing: 0.06em; }
    .btn { fill: #005fb8; }
    .btnt { font-size: 16px; fill: #fff; font-weight: 600; }
    .row { font-size: 16px; fill: #1f1f1f; }
    .sel { fill: #e4e6f1; }
    .input { fill: #fff; stroke: #005fb8; stroke-width: 1.5; }
    .ph { font-size: 15px; fill: #8a8a8a; }
    .call { fill: #fab52a; }
    .callt { font-size: 15px; font-weight: 700; fill: #14181d; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .cap { font-size: 18px; font-weight: 700; fill: #1e2b3e; font-family: Unil Sans, Arial, sans-serif; }
  </style>

  <text class="cap" x="10" y="24">① No remote yet: the button says Publish</text>
  <g transform="translate(10,36)">
    <rect class="win" width="440" height="200"/>
    <text class="head" x="20" y="30">SOURCE CONTROL</text>
    <rect class="btn" x="20" y="50" width="400" height="36" rx="2"/>
    <g transform="translate(140,57)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6,17 H4.5 A4.2,4.2 0 0 1 4.5,8.6 A6.2,6.2 0 0 1 16.3,7 A4.6,4.6 0 0 1 17.5,17 H15"/>
      <path d="M10.7,20 V11.5 M7.6,14.4 L10.7,11.3 L13.8,14.4"/>
    </g>
    <text class="btnt" x="232" y="74" text-anchor="middle">Publish Branch</text>
    <text class="head" x="20" y="120">⌄ GRAPH</text>
    <circle cx="34" cy="146" r="7" fill="#005fb8"/><text class="row" x="54" y="152">session 6: read csv, write report</text>
    <circle cx="34" cy="176" r="7" fill="#fff" stroke="#005fb8" stroke-width="3"/><text class="row" x="54" y="182">session 5: positions as dicts</text>
  </g>
  <rect class="call" x="10" y="260" width="440" height="34"/>
  <text class="callt" x="230" y="282" text-anchor="middle">Publish = git remote add + git push -u</text>

  <text class="cap" x="500" y="24">② VS Code asks where to put it</text>
  <g transform="translate(500,36)">
    <rect class="pick" width="590" height="160"/>
    <rect class="input" x="12" y="12" width="566" height="34"/>
    <text class="ph" x="24" y="35">Publish to GitHub…</text>
    <rect class="sel" x="1" y="56" width="588" height="44"/>
    <text class="row" x="24" y="84">Publish to GitHub private repository  ledger</text>
    <text class="row" x="24" y="132">Publish to GitHub public repository  ledger</text>
  </g>
  <text class="row" x="500" y="230" font-family="Unil Sans, Arial, sans-serif" fill="#4b5563">The first time, VS Code asks you to sign in to GitHub in</text>
  <text class="row" x="500" y="254" font-family="Unil Sans, Arial, sans-serif" fill="#4b5563">the browser. Private: only you can see it.</text>
</svg>
