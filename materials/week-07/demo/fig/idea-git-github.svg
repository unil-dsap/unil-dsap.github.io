<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="Unil Sans, Arial, sans-serif">
  <!-- git is a program on your machine; GitHub is a website that keeps copies. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e2b3e"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #395b8c; stroke-width: 2; }
    .hub { fill: #eef4fb; stroke: #1e2b3e; stroke-width: 3; }
    .big { font-size: 34px; font-weight: 700; fill: #1e2b3e; }
    .kind { font-size: 18px; fill: #395b8c; font-weight: 700; }
    .line { font-size: 17px; fill: #14181d; }
    .cmd { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #1e2b3e; }
    .arrow { stroke: #1e2b3e; stroke-width: 3; fill: none; }
  </style>

  <rect class="box" x="10" y="10" width="440" height="280"/>
  <text class="big" x="36" y="62">git</text>
  <text class="kind" x="36" y="92">a program on your machine</text>
  <text class="line" x="36" y="134">• keeps the history of one folder</text>
  <text class="line" x="36" y="164">• works with no internet, no account</text>
  <text class="line" x="36" y="194">• you run it: in the terminal, or through</text>
  <text class="line" x="52" y="218">the buttons in VS Code</text>
  <text class="line" x="36" y="254">• already installed on Nuvolos</text>

  <rect class="hub" x="650" y="10" width="440" height="280"/>
  <text class="big" x="676" y="62">GitHub</text>
  <text class="kind" x="676" y="92">a website that keeps copies</text>
  <text class="line" x="676" y="134">• stores a copy of a git repository</text>
  <text class="line" x="676" y="164">• needs a free account</text>
  <text class="line" x="676" y="194">• lets another machine get the copy</text>
  <text class="line" x="676" y="224">• one of several such sites</text>
  <text class="line" x="692" y="248">(GitLab and Bitbucket are others)</text>

  <path class="arrow" d="M460,120 L640,120" marker-end="url(#a)"/>
  <text class="cmd" x="550" y="108" text-anchor="middle">push</text>
  <path class="arrow" d="M640,190 L460,190" marker-end="url(#a)"/>
  <text class="cmd" x="550" y="220" text-anchor="middle">pull · clone</text>
</svg>
