<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <!-- Stylized agent session: one diff card per edit, scrolling past.
       Illustrative only — file names from the course ledger folder. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8" stop-opacity="1"/>
      <stop offset="1" stop-color="#f8f8f8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .panel { fill: #f8f8f8; stroke: #d0d0d0; stroke-width: 1.5; }
    .head { font-size: 13px; font-weight: 700; fill: #3b3b3b; letter-spacing: 0.06em; }
    .card { fill: #fff; stroke: #d0d0d0; }
    .file { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1f1f1f; }
    .plus { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #388a34; font-weight: 700; }
    .minus { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #c4314b; font-weight: 700; }
    .dim { font-size: 12px; fill: #6b6b6b; }
    .del { fill: #fde2e1; }
    .add { fill: #dcf5e3; }
    .ln { fill: #e9ecef; }
  </style>

  <rect class="panel" x="1" y="1" width="478" height="498" rx="6"/>
  <text class="head" x="18" y="26">AI AGENT</text>

  <!-- card template: header + a few colored lines (text as grey bars) -->
  <g>
    <text class="dim" x="18" y="52">Edited ledger.csv</text>
    <rect class="card" x="16" y="58" width="448" height="78" rx="5"/>
    <text class="file" x="28" y="77">ledger.csv</text><text class="plus" x="400" y="77">+1</text><text class="minus" x="428" y="77">−0</text>
    <rect class="ln" x="28" y="88" width="170" height="8" rx="3"/>
    <rect class="add" x="17" y="102" width="446" height="16"/><rect x="40" y="106" width="150" height="8" rx="3" fill="#9fdcb4"/>
    <rect class="ln" x="28" y="124" width="120" height="6" rx="3"/>
  </g>
  <g>
    <text class="dim" x="18" y="160">Edited ledger.py</text>
    <rect class="card" x="16" y="166" width="448" height="104" rx="5"/>
    <text class="file" x="28" y="185">ledger.py</text><text class="plus" x="400" y="185">+2</text><text class="minus" x="428" y="185">−2</text>
    <rect class="ln" x="28" y="196" width="140" height="8" rx="3"/>
    <rect class="del" x="17" y="210" width="446" height="16"/><rect x="40" y="214" width="190" height="8" rx="3" fill="#f3a7a4"/>
    <rect class="add" x="17" y="226" width="446" height="16"/><rect x="40" y="230" width="180" height="8" rx="3" fill="#9fdcb4"/>
    <rect class="ln" x="28" y="250" width="100" height="8" rx="3"/>
  </g>
  <g>
    <text class="dim" x="18" y="294">Edited ledger.py</text>
    <rect class="card" x="16" y="300" width="448" height="104" rx="5"/>
    <text class="file" x="28" y="319">ledger.py</text><text class="plus" x="400" y="319">+4</text><text class="minus" x="428" y="319">−1</text>
    <rect class="ln" x="28" y="330" width="160" height="8" rx="3"/>
    <rect class="del" x="17" y="344" width="446" height="16"/><rect x="40" y="348" width="210" height="8" rx="3" fill="#f3a7a4"/>
    <rect class="add" x="17" y="360" width="446" height="16"/><rect x="40" y="364" width="230" height="8" rx="3" fill="#9fdcb4"/>
    <rect class="add" x="17" y="376" width="446" height="16"/><rect x="60" y="380" width="170" height="8" rx="3" fill="#9fdcb4"/>
    <rect class="ln" x="28" y="396" width="80" height="4" rx="2"/>
  </g>
  <g>
    <text class="dim" x="18" y="428">Edited README.md</text>
    <rect class="card" x="16" y="434" width="448" height="60" rx="5"/>
    <text class="file" x="28" y="453">README.md</text><text class="plus" x="400" y="453">+3</text><text class="minus" x="428" y="453">−0</text>
    <rect class="add" x="17" y="462" width="446" height="16"/><rect x="40" y="466" width="200" height="8" rx="3" fill="#9fdcb4"/>
  </g>

  <!-- older cards fade out at the top: they have scrolled past -->
  <rect x="2" y="34" width="476" height="90" fill="url(#fade)"/>
  <!-- scroll bar -->
  <rect x="470" y="40" width="5" height="450" rx="2.5" fill="#e5e5e5"/>
  <rect x="470" y="330" width="5" height="120" rx="2.5" fill="#9aa5b1"/>
</svg>
