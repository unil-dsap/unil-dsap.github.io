<p>Logistic regression on the embeddings, 680 test sentences. Rows: the truth; columns: the prediction.</p>
<ul>
<li><strong>Negative:</strong> 83 of 91 found (recall 0.91).</li>
<li>Most mistakes are <strong>positive → neutral</strong> (20): a mildly good result read as a plain fact.</li>
<li>A negative sentence is almost <strong>never</strong> read as positive (1 of 91); the other way round happens more (13).</li>
</ul>

<header>Session 11 · Workshop</header>
<h1 id="same-data-no-answers">Same data, no answers</h1>
<ul>
<li>The same 2,264 sentences from financial news, the same 768 numbers per sentence (EmbeddingGemma).</li>
<li>Last week we <strong>gave</strong> the labels and trained a classifier.</li>
<li>Today the methods <strong>never see</strong> the labels. They group the sentences into <strong>topics</strong>, and we name the topics ourselves.</li>
<li>Only at the very end we look at the labels: which topics are bad news?</li>
</ul>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="Session 11 · Workshop" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:Session 11 · Workshop;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="13">
<header>Session 11 · Workshop</header>
<h1 id="agglomerative-clustering">Agglomerative clustering</h1>
<ul>
<li>Start with every sentence alone. Repeatedly <strong>merge the two closest groups</strong>, until 10 are left.</li>
<li><strong>Ward</strong> linkage: merge the pair that adds the least spread.</li>
<li><strong>Average</strong> linkage: merge by average distance. On our data it builds one giant group (step 4): the linkage decides.</li>
<li>The full history of merges is the <strong>dendrogram</strong>.</li>
</ul>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="Session 11 · Workshop" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:Session 11 · Workshop;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="13">
<header>Session 11 · Workshop</header>
<h1 id="naming-a-topic">Naming a topic</h1>
<p>A group is just a number. To understand it, find its <strong>characteristic words</strong>:</p>
<ul>
<li>frequent <strong>in</strong> the topic, rare in the others: TF-IDF with one &quot;document&quot; per topic;</li>
<li>then read one example sentence.</li>
</ul>
<p>This is the idea behind modern topic models (such as BERTopic): embeddings to group, words to name.</p>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="Session 11 · Workshop" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:Session 11 · Workshop;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="13">
<header>Session 11 · Workshop</header>
<h1 id="pca-only-to-draw">PCA, only to draw</h1>
<ul>
<li>768 axes cannot be drawn. PCA finds the directions with the most spread.</li>
<li>For the stocks in the lecture, PC1 was the market. Here PC1 explains about <strong>7 %</strong>: meaning is spread out.</li>
<li>So we <strong>group in all 768 numbers</strong>, and use PCA only for the picture (step 6).</li>
</ul>
<footer>Data Science and Advanced Programming · UNIL · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="Session 11 · Workshop" data-footer="Data Science and Advanced Programming · UNIL · 2026" data-theme="hec-2026" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:Session 11 · Workshop;--footer:Data Science and Advanced Programming · UNIL · 2026;--theme:hec-2026;" data-marpit-pagination-total="13">
<header>Session 11 · Workshop</header>
<h1 id="how-todays-file-works">How today's file works</h1>
<ol>
<li>Open only <strong>week-11/workshop/workshop.py</strong>. The data files <code>phrasebank.csv</code> and <code>embeddings.npy</code> just stay in the same folder: you do not open them, the program reads them.</li>
<li>Find the first <code>___</code> and replace it.</li>
<li>Press ▷ and read the terminal: ✓ with what the result means, or ✗ with a hint.</li>
<li>Pictures appear as <strong>step-N.png</strong> next to the file.</li>
</ol>
<p><strong>Steps:</strong> 1 load · 2 PCA · 3 ten topics (Ward) · 4 average linkage · 5 name the topics · 6 🖼 topic map · 7 🖼 tree of topics · 8 🖼 which topics are bad news?<br />
★ 9 k-means vs Ward · 10 the same with word counts · 11 PCA by hand</p>
